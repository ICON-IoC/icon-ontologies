enums:
  GovernmentLevelEnum:
    enum_uri: ICON:0006010
    description: The values of government level.
    permissible_values:
      federal level:
        meaning: ICON:0006011
        description: The United States government.
        annotations:
          runtime: term GovLevel "Federal"
      state level:
        meaning: ICON:0006012
        description: The State of California.
        annotations:
          runtime: term GovLevel "State"
      local level:
        meaning: ICON:0006013
        description: Counties, cities and special districts.
        annotations:
          runtime: term GovLevel "Local"
      private level:
        meaning: ICON:0006014
        description: 'No government: a standard or agreement set by private parties.'
        annotations:
          runtime: term GovLevel "Private"
      international level:
        meaning: ICON:0006015
        description: 'An agreement among national governments, such as a treaty or a decision of the parties
          to a convention. Example: the Kunming-Montreal Global Biodiversity Framework (2022), adopted
          under the Convention on Biological Diversity.'
        annotations:
          runtime: term GovLevel "International"
