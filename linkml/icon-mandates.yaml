# ICON Guidelines and mandates ontology, as a LinkML schema.
# Built by `ioc-ontologies` from ontology/src/mandates.terms; edit that, not this file.
id: https://w3id.org/icon-ioc/linkml/icon-mandates
name: icon-mandates
prefixes:
  linkml: https://w3id.org/linkml/
  ICON: https://w3id.org/icon-ioc/ICON_
  OMRSE: http://purl.obolibrary.org/obo/OMRSE_
  eli: http://data.europa.eu/eli/ontology#
  schema: https://schema.org/
title: ICON Guidelines and mandates ontology
description: 'Laws, regulations, executive orders, agreements, certifications and guidelines that require,
  allow, fund or shape conservation work, and the ways organizations stand toward them: bound by, implementing,
  enforcing, issuing, certified by.'
version: '2026-11-21'
license: https://creativecommons.org/licenses/by/4.0/
default_prefix: ICON
default_range: string
see_also:
- https://w3id.org/icon-ioc/mandates.owl
imports:
- linkml:types
- icon-external
- icon-core
- icon-projects
classes:
  GuidelineOrMandate:
    class_uri: ICON:0006000
    title: guideline or mandate
    description: 'A directive that requires, allows, funds or shapes conservation work: a law, regulation,
      executive order, agreement, certification standard or guideline. Some bind; others only advise.'
    close_mappings:
    - eli:LegalResource
    - schema:Legislation
    annotations:
      runtime: class GuidelineMandate; class Rule; vocab GMType
    is_a: DirectiveInformationEntity
  Agreement:
    class_uri: ICON:0006001
    title: agreement
    description: A guideline or mandate that two or more parties sign, such as a memorandum of understanding,
      a settlement or a habitat conservation plan's implementing agreement.
    close_mappings:
    - OMRSE:00000089
    annotations:
      runtime: term GMType "Agreement"
    is_a: GuidelineOrMandate
  CertificationStandard:
    class_uri: ICON:0006002
    title: certification standard
    description: A guideline or mandate that sets the practices land, products or operations must meet
      to be certified, such as a sustainable farming or forestry standard.
    annotations:
      runtime: term GMType "Certification"
    is_a: GuidelineOrMandate
  ExecutiveOrder:
    class_uri: ICON:0006003
    title: executive order
    description: A guideline or mandate that a president or governor issues to direct government agencies.
    annotations:
      runtime: term GMType "Executive Order"
    is_a: GuidelineOrMandate
  Guideline:
    class_uri: ICON:0006004
    title: guideline
    description: A guideline or mandate that recommends how something should be done without binding anyone.
    annotations:
      runtime: term GMType "Guidelines"
    is_a: GuidelineOrMandate
  Legislation:
    class_uri: ICON:0006005
    title: legislation
    description: 'A guideline or mandate that a legislature or the voters enact: a statute, an act, a
      ballot measure.'
    close_mappings:
    - schema:Legislation
    annotations:
      runtime: term GMType "Legislation"
    is_a: GuidelineOrMandate
  Regulation:
    class_uri: ICON:0006006
    title: regulation
    description: A guideline or mandate that an agency adopts under authority a statute gives it, with
      the force of law, as in the California Code of Regulations.
    annotations:
      runtime: term GMType "Regulation"
    is_a: GuidelineOrMandate
  AgencyRule:
    class_uri: ICON:0006007
    title: agency rule
    description: A guideline or mandate that a body adopts to govern its own lands, programs or members,
      short of a codified regulation.
    annotations:
      runtime: term GMType "Rule"
    is_a: GuidelineOrMandate
  CourtOrder:
    class_uri: ICON:0006008
    title: court order
    description: 'A guideline or mandate that a court issues in a case, such as a writ of mandate or an
      injunction, directing a party, often a government agency, to act or to stop acting. It binds the
      parties named in it. Example: the 2025 writ of mandate in California Chaparral Institute v. Board
      of Forestry and Fire Protection, which limits the California Vegetation Treatment Program in chaparral
      and coastal sage scrub.'
    annotations:
      runtime: term GMType "Court order"
    is_a: GuidelineOrMandate
  GovernmentLevel:
    class_uri: ICON:0006010
    title: government level
    description: The level of government a guideline or mandate comes from or applies at.
    annotations:
      runtime: vocab GovLevel
    is_a: InformationContentEntity
