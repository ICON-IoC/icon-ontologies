    annotations:
      runtime: phrase "has instrument type"
    domain: GuidelineOrMandate
    domain_of:
    - GuidelineOrMandate
    range: uriorcurie
    inverse: is_instrument_type_of
    multivalued: true
  is_instrument_type_of:
