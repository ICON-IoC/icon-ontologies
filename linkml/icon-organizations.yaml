  located_in_county:
    slot_uri: ICON:0001109
    title: located in county
    description: The county that holds the organization's headquarters, main office or seat. An organization
      is located in at most one county, and may operate in many (#949).
    comments:
    - Every local government is located in one county. A city's is the county the city lies in, a county
      government's is its own county, and a special district's or regional agency's is the county of its
      main office. Located in county is a kind of located in area, so the organization also operates in
      the county.
    close_mappings:
    - schema:location
    - org:hasPrimarySite
    annotations:
      xref: Wikidata:P159
      runtime: phrase "located in county"
    is_a: located_in_area
    domain: Organization
    domain_of:
    - Organization
    range: County
    inverse: is_county_location_of
    multivalued: false
  is_county_location_of:
    slot_uri: ICON:0001110
    title: is county location of
    description: 'The reverse of located in county: the county holds the organization''s headquarters.'
    annotations:
      runtime: phrase "is county location of"
    domain: County
    domain_of:
    - County
    range: Organization
    inverse: located_in_county
    multivalued: true
  located_in_ecoregion:
    slot_uri: ICON:0001111
    title: located in ecoregion
    description: The ecoregion section that holds the organization's headquarters, main office or seat.
      An organization is located in at most one ecoregion section, and may work in many (#949).
    comments:
    - Every local government is located in one ecoregion section, the one its headquarters point lies
      in. Located in ecoregion is a kind of in ecoregion, so a question about the local governments in
      an ecoregion finds it.
    close_mappings:
    - schema:location
    - org:hasPrimarySite
    annotations:
      xref: Wikidata:P159
      runtime: phrase "located in ecoregion"
    is_a: in_ecoregion
    mixins:
    - located_in
    domain: Organization
    domain_of:
    - Organization
    range: Ecoregion
    inverse: is_ecoregion_location_of
    multivalued: false
  is_ecoregion_location_of:
    slot_uri: ICON:0001112
    title: is ecoregion location of
    description: 'The reverse of located in ecoregion: the ecoregion section holds the organization''s
      headquarters.'
    annotations:
      runtime: phrase "is ecoregion location of"
    domain: Ecoregion
