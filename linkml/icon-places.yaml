enums:
  GeographicScopeEnum:
    enum_uri: ICON:0010003
    description: The values of geographic scope.
    permissible_values:
      statewide:
        meaning: ICON:0010004
        description: The whole of California. A record that operates, applies or lies statewide is linked
          to this value rather than to every county, ecoregion, subbasin and watershed (#281).
        comments:
        - The explorer's statewide rule derives the record's links to every county and ecoregion when
          a question needs them. OWL cannot state it, since it turns one link into many by the category
          of the target.
        annotations:
          runtime: term Scope "Statewide"
