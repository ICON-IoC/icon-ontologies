    annotations:
      runtime: phrase "in watershed"
    range: HUC10Watershed
    inverse: is_watershed_of
    multivalued: true
  is_watershed_of:
    slot_uri: ICON:0010113
    title: is watershed of
    description: The reverse of in watershed.
    annotations:
      runtime: phrase "is watershed of"
