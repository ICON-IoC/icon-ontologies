# ICON Plans ontology, as a LinkML schema.
# Built by `ioc-ontologies` from ontology/src/plans.terms; edit that, not this file.
id: https://w3id.org/icon/linkml/icon-plans
name: icon-plans
prefixes:
  linkml: https://w3id.org/linkml/
  ICON: https://w3id.org/icon/ICON_
  pplan: http://purl.org/net/p-plan#
title: ICON Plans ontology
description: 'Conservation plans, such as species recovery plans, with their objectives and actions: who
  issues a plan, which sites and taxa it covers, which actions serve which objectives, and who leads or
  takes part in each action.'
version: '2026-11-21'
license: https://creativecommons.org/licenses/by/4.0/
default_prefix: ICON
default_range: string
see_also:
- https://w3id.org/icon/plans.owl
imports:
- linkml:types
- icon-external
- icon-core
- icon-infrastructure
- icon-mandates
classes:
  ConservationPlan:
    class_uri: ICON:0007001
    title: conservation plan
    description: A plan specification issued by an agency or organization that sets conservation objectives
      and the actions to meet them, such as a species recovery plan.
    close_mappings:
    - pplan:Plan
    annotations:
      runtime: class Plan; vocab PlanType
    is_a: PlanningElement
    mixins:
    - PlanSpecification
  PlanObjective:
    class_uri: ICON:0007002
    title: plan objective
    description: 'An objective specification within a conservation plan: a condition the plan aims to
      reach, often with measurable criteria, such as a population target for a recovery unit.'
    annotations:
      runtime: class Objective
    is_a: PlanningElement
    mixins:
    - ObjectiveSpecification
  PlanAction:
    class_uri: ICON:0007003
    title: plan action
    description: 'An action specification within a conservation plan: a task the plan calls for, with
      its priority, cost, lead and cooperators. Actions nest: a sub-action is part of its action.'
    close_mappings:
    - pplan:Step
    annotations:
      runtime: class Action
    is_a: PlanningElement
    mixins:
    - ActionSpecification
  RecoveryPlan:
    class_uri: ICON:0007004
    title: recovery plan
    description: A conservation plan for one or more species listed under the Endangered Species Act,
      issued by the Fish and Wildlife Service or NOAA Fisheries, that sets recovery criteria and actions.
    annotations:
      runtime: term PlanType "Recovery plan"
    is_a: ConservationPlan
  WatershedManagementPlan:
    class_uri: ICON:0007005
    title: watershed management plan
    description: A conservation plan for one or more watersheds, written by the agencies, landowners and
      groups working in them, that assesses their condition and sets out actions to restore them, protect
      the waters they drain to, or keep development from adding to flooding.
    annotations:
      runtime: term PlanType "Watershed management plan"
    is_a: ConservationPlan
  ConservationPrioritiesPlan:
    class_uri: ICON:0007006
    title: conservation priorities plan
    description: A conservation plan for a region, written by a partnership of agencies, organizations
      and residents, that ranks its lands by the conservation values they serve and sets out where and
      how to protect the highest-ranked ones.
    annotations:
      runtime: term PlanType "Conservation priorities plan"
    is_a: ConservationPlan
  ConservationActionPlan:
    class_uri: ICON:0007007
    title: conservation action plan
    description: 'A conservation plan written with The Nature Conservancy''s Conservation Action Planning
      method: it names focal conservation targets, rates their viability, ranks the threats to them, and
      sets measurable objectives with strategic actions ranked by benefit, feasibility and cost.'
    annotations:
      runtime: term PlanType "Conservation action plan"
    is_a: ConservationPlan
  NationalMarineSanctuaryManagementPlan:
    class_uri: ICON:0007008
    title: national marine sanctuary management plan
    description: A conservation plan for a national marine sanctuary, issued by NOAA's Office of National
      Marine Sanctuaries and reviewed periodically under the National Marine Sanctuaries Act, that sets
      out action plans of strategies and activities for the sanctuary's resource issues and programs,
      often with revised regulations.
    annotations:
      runtime: term PlanType "National marine sanctuary management plan"
    is_a: ConservationPlan
  WetlandManagementPlan:
    class_uri: ICON:0007009
    title: wetland management plan
    description: A conservation plan for a marsh or other wetland complex, written by the agencies and
      landowners that manage it, that sets acreage targets for restoring and managing its wetlands and
      the activities, permits and monitoring to reach them.
    annotations:
      runtime: term PlanType "Wetland management plan"
    is_a: ConservationPlan
  ComprehensiveConservationAndManagementPlan:
    class_uri: ICON:0007010
    title: comprehensive conservation and management plan
    description: A conservation plan for an estuary of national significance, written under Clean Water
      Act Section 320 by the management conference of a National Estuary Program (agencies, scientists,
      local governments and the public) and approved by the Environmental Protection Agency, that sets
      goals and long-term actions for the estuary and its watershed and is revised every few years.
    annotations:
      runtime: term PlanType "Comprehensive conservation and management plan"
    is_a: ConservationPlan
  LandscapeConservationStrategy:
    class_uri: ICON:0007011
    title: landscape conservation strategy
    description: A conservation plan for a region's lands, written by the agencies and organizations that
      own or fund them, that sets shared goals and high-level strategies for where conservation and restoration
      could go across the landscape alongside other aims such as flood management, agriculture and recreation,
      without committing any owner to projects.
    annotations:
      runtime: term PlanType "Landscape conservation strategy"
    is_a: ConservationPlan
  OpenSpaceVisionPlan:
    class_uri: ICON:0007012
    title: open space vision plan
    description: A conservation plan for the lands of a regional open space or park district and the region
      around them, written by the district with a community advisory committee and public engagement,
      that sets long-term themes and goals for conservation, public access, education and working lands
      and ranks place-based priority actions, often as the basis for a funding measure.
    annotations:
      runtime: term PlanType "Open space vision plan"
    is_a: ConservationPlan
  BiodiversityActionPlan:
    class_uri: ICON:0007013
    title: biodiversity action plan
    description: A conservation plan for the biodiversity of a county, region or nation, written with
      the experts, agencies and organizations working there, that describes its habitats and species of
      concern, the threats to them, and recommended, usually voluntary, actions for science, land protection
      and stewardship, and education. Local plans follow the model of national biodiversity strategies
      and action plans under the Convention on Biological Diversity.
    annotations:
      runtime: term PlanType "Biodiversity action plan"
    is_a: ConservationPlan
  EcoregionalAssessment:
    class_uri: ICON:0007014
    title: ecoregional assessment
    description: A conservation plan for a whole ecoregion, made with The Nature Conservancy's ecoregional
      planning method, that sets quantitative goals for a suite of species, ecological systems and other
      conservation targets, maps how much each part of the ecoregion contributes to meeting them, often
      with site-selection software such as Marxan, and recommends broad strategies for protecting the
      places of highest conservation value and steering development elsewhere. It informs the land-use
      and conservation decisions of others rather than committing any party to actions.
    annotations:
      runtime: term PlanType "Ecoregional assessment"
    is_a: ConservationPlan
  StatewideConservationStrategy:
    class_uri: ICON:0007015
    title: statewide conservation strategy
    description: A conservation plan for a whole state, issued by its government to meet a statewide area-based
      conservation goal such as conserving 30 percent of its lands and coastal waters by 2030, that defines
      what counts as conserved, sets key objectives, and lays out pathways of strategic actions for state
      agencies working with tribes, federal and local governments and other partners, with progress tracked
      in public data and periodic reports.
    annotations:
      runtime: term PlanType "Statewide conservation strategy"
    is_a: ConservationPlan
  HabitatConservationAndManagementPlan:
    class_uri: ICON:0007016
    title: habitat conservation and management plan
    description: A conservation plan for one rare habitat type across its whole range, such as an endemic
      sand or serpentine community, written by scientists with the land trusts, agencies and landowners
      working there, that maps and ranks the remaining habitat sites, synthesizes the biology of its sensitive
      species and the threats to them, and recommends which lands to preserve and how to manage them (fire,
      invasive plants, recreation, restoration), with research and education. It is advisory and binds
      no owner, unlike a habitat conservation plan under the Endangered Species Act.
    annotations:
      runtime: term PlanType "Habitat conservation and management plan"
    is_a: ConservationPlan
  RegionalConservationInvestmentStrategy:
    class_uri: ICON:0007017
    title: regional conservation investment strategy
    description: A voluntary, non-regulatory conservation assessment for a region, prepared by a public
      agency under California's Regional Conservation Investment Strategies Program (Fish and Game Code
      1850 to 1861) and approved by the California Department of Fish and Wildlife for up to 10 years,
      that names focal species and other conservation elements, sets goals and measurable objectives for
      them, and lists conservation actions and habitat enhancement actions with priority locations. Its
      actions can earn advance mitigation credits through mitigation credit agreements, unlike a plan
      that binds no one to mitigation.
    annotations:
      runtime: term PlanType "Regional conservation investment strategy"
    is_a: ConservationPlan
  AgencyStrategicPlan:
    class_uri: ICON:0007018
    title: agency strategic plan
    description: A conservation plan in which a public agency or board sets its own goals, objectives
      and numerical targets for a fixed period, usually five years, to steer the grants, acquisitions
      and programs it funds, aligned with statewide strategies and shaped by public workshops and tribal
      consultation. It commits the agency itself, not other parties, and is carried out through the projects
      it chooses to fund.
    annotations:
      runtime: term PlanType "Agency strategic plan"
    is_a: ConservationPlan
  InteragencySharedStrategy:
    class_uri: ICON:0007019
    title: interagency shared strategy
    description: A conservation plan for one statewide land management need, such as reforestation after
      wildfire, written by state and federal agencies with nonprofit and university partners under an
      interagency body such as California's Wildfire and Forest Resilience Task Force, that measures the
      need and the progress against it, proposes how to prioritize the work, and sets goals with key actions
      assigned to named agencies and partnerships. It informs the body's action plan and binds no agency.
    annotations:
      runtime: term PlanType "Interagency shared strategy"
    is_a: ConservationPlan
  IntegratedRegionalWaterManagementPlan:
    class_uri: ICON:0007020
    title: integrated regional water management plan
    description: A plan for all aspects of water management in a region approved by the California Department
      of Water Resources, written under the Integrated Regional Water Management Planning Act by a Regional
      Water Management Group of local water, wastewater, flood control and watershed agencies, that sets
      regional objectives for water supply, water quality, flood management and ecosystem protection,
      ranks a living list of projects its members sponsor, and makes those projects eligible for state
      IRWM grants. Each member agency adopts it, and it binds none of them to carry out a project.
    annotations:
      runtime: term PlanType "Integrated regional water management plan"
    is_a: ConservationPlan
  HabitatConservationPlan:
    class_uri: ICON:0007021
    title: habitat conservation plan
    description: A conservation plan that a non-federal landowner or agency prepares under Section 10(a)(1)(B)
      of the federal Endangered Species Act to obtain an incidental take permit from the U.S. Fish and
      Wildlife Service or NOAA Fisheries, that names the covered species and covered activities, sets
      biological goals and objectives, and commits the permittee to measures that avoid, minimize and
      mitigate the take, with monitoring, adaptive management, funding assurances and a fixed permit term.
      It binds the permittee through the permit and its implementing agreement.
    annotations:
      runtime: term PlanType "Habitat conservation plan"
    is_a: ConservationPlan
  FisheryManagementPlan:
    class_uri: ICON:0007022
    title: fishery management plan
    description: A conservation plan that a regional fishery management council prepares under Section
      303 of the Magnuson-Stevens Fishery Conservation and Management Act for a fishery in federal waters,
      that names the managed stocks, sets goals and objectives, defines overfishing and optimum yield,
      describes and identifies essential fish habitat, and sets the framework for harvest limits, allocation
      and other management measures. The Secretary of Commerce approves it and its amendments, and NOAA
      Fisheries implements it through federal regulations that bind those who fish.
    annotations:
      runtime: term PlanType "Fishery management plan"
    is_a: ConservationPlan
  FisheryEcosystemPlan:
    class_uri: ICON:0007023
    title: fishery ecosystem plan
    description: A conservation plan that a regional fishery management council adopts to bring ecosystem
      science and policy into its fishery management plans, that describes the marine ecosystem its fisheries
      depend on, sets ecosystem goals and objectives across those plans, and identifies research needs
      and cross-plan initiatives. It informs the council's decisions and binds no one.
    annotations:
      runtime: term PlanType "Fishery ecosystem plan"
    is_a: ConservationPlan
  ClimateAdaptationPlan:
    class_uri: ICON:0007024
    title: climate adaptation plan
    description: 'A conservation plan that a public body adopts to prepare a region for climate change,
      that builds on an assessment of its vulnerability to hazards such as flooding, sea level rise, extreme
      heat and drought, and that sets adaptation strategies with implementing actions and recommended
      lead and partner agencies across sectors such as flood management, ecosystems, agriculture and water
      supply. Example: the Delta Stewardship Council''s Delta Adapts Adaptation Plan (2025).'
    annotations:
      runtime: term PlanType "Climate adaptation plan"
    is_a: ConservationPlan
  RegionalPriorityPlan:
    class_uri: ICON:0007025
    title: regional priority plan
    description: 'A conservation plan that a regional grantee of California''s Regional Forest and Fire
      Capacity Program prepares for its planning area, that assesses wildfire risk and forest and landscape
      health, names landscapes of interest, strategies and near-term projects, and builds the region''s
      capacity to carry them out. Example: the San Bernardino Mountains Regional Priority Plan.'
    annotations:
      runtime: term PlanType "Regional priority plan"
    is_a: ConservationPlan
  BirdConservationPlan:
    class_uri: ICON:0007026
    title: bird conservation plan
    description: 'A conservation plan for the birds of one habitat across a state or region, written by
      a bird conservation partnership such as Partners in Flight or a habitat joint venture, that chooses
      focal bird species to stand for the habitat, sets population and habitat objectives for them, names
      portfolio sites, and recommends habitat protection, restoration, management, monitoring, research
      and policy actions. It binds no one. Example: California Partners in Flight''s Riparian Bird Conservation
      Plan (2004).'
    annotations:
      runtime: term PlanType "Bird conservation plan"
    is_a: ConservationPlan
  AgriculturalWaterManagementPlan:
    class_uri: ICON:0007027
    title: agricultural water management plan
    description: 'A plan that an agricultural water supplier serving 10,000 or more irrigated acres prepares
      and adopts every five years under the California Water Code (Section 10826, from the Water Conservation
      Act of 2009), that describes its service area, water supplies and water use, accounts for its water
      budget, reports its efficient water management practices (accurate measurement and volumetric pricing,
      and the conditional practices that are feasible) and includes a drought plan. It is submitted to
      the Department of Water Resources and binds the supplier to report, not to reach set targets. Example:
      the Yolo County Flood Control and Water Conservation District Agricultural Water Management Plan
      2025.'
    annotations:
      runtime: term PlanType "Agricultural water management plan"
    is_a: ConservationPlan
  GroundwaterManagementPlan:
    class_uri: ICON:0007028
    title: groundwater management plan
    description: 'A plan that a local agency adopts under California''s Groundwater Management Act (Water
      Code Section 10750 and following, from AB 3030 of 1992 and SB 1938 of 2002) to manage the groundwater
      beneath its area, with basin management objectives, a monitoring program for water levels, quality
      and subsidence, and actions such as recharge and conjunctive use. It preceded the Sustainable Groundwater
      Management Act of 2014, whose groundwater sustainability plans now govern medium and high priority
      basins. Example: the Yolo County Flood Control and Water Conservation District Groundwater Management
      Plan 2006.'
    annotations:
      runtime: term PlanType "Groundwater management plan"
    is_a: ConservationPlan
  WaterManagementPlan:
    class_uri: ICON:0007029
    title: water management plan
    description: 'A water supplier''s plan for managing its surface water and groundwater together, setting
      out its water rights, facilities and use and a program of actions to improve management and develop
      new supply, adopted under the agency''s own authority rather than a specific planning statute. Example:
      the Yolo County Flood Control and Water Conservation District Water Management Plan 2000.'
    annotations:
      runtime: term PlanType "Water management plan"
    is_a: ConservationPlan
  StateWildlifeActionPlan:
    class_uri: ICON:0007030
    title: state wildlife action plan
    description: 'A state fish and wildlife agency''s comprehensive wildlife conservation strategy, required
      every ten years for the state to receive federal State Wildlife Grant funds, that lists the Species
      of Greatest Conservation Need, describes their key habitats and the pressures on them, and sets
      conservation strategies by region and habitat, with monitoring and partner coordination. It is a
      guide for the agency and its partners, not a regulation. Example: California''s State Wildlife Action
      Plan 2025 (CDFW).'
    annotations:
      runtime: term PlanType "State wildlife action plan"
    is_a: ConservationPlan
  SectorCompanionPlan:
    class_uri: ICON:0007031
    title: sector companion plan
    description: 'A plan that carries a broader conservation plan into one sector, such as agriculture,
      energy, transportation, water management or tribal lands, written with that sector''s agencies and
      organizations. It names the sector''s priority pressures and strategy categories, potential conservation
      activities at statewide, regional and local scales, desired outcomes, and potential partners and
      funding, without binding anyone. It implements the broader plan. Example: the nine companion plans
      of California''s State Wildlife Action Plan.'
    annotations:
      runtime: term PlanType "Sector companion plan"
    is_a: ConservationPlan
  FloodRiskManagementPlan:
    class_uri: ICON:0007032
    title: flood risk management plan
    description: 'A long-range plan for managing flood risk across a river basin or region, issued by
      the agency responsible for its flood system and updated on a fixed cycle, that sets goals for reducing
      the chance of flooding and the damage and loss of life when it happens, and recommends a portfolio
      of investments in levees, bypasses, reservoirs, floodplains and emergency response alongside ecosystem
      restoration, multi-benefit projects and the policies and funding needed to carry them out. Example:
      California''s Central Valley Flood Protection Plan, updated every five years under the Central Valley
      Flood Protection Act of 2008.'
    annotations:
      runtime: term PlanType "Flood risk management plan"
    is_a: ConservationPlan
  ParkManagementPlan:
    class_uri: ICON:0007033
    title: park management plan
    description: 'A plan for one park or preserve, adopted by the public body that owns it and often required
      by a regional habitat conservation plan whose reserve the park belongs to, that sets for decades
      how its natural, cultural and paleontological resources are protected, restored and monitored (a
      resource management plan) or where trails, staging areas and facilities may go (a general development
      plan), and guides the agency''s later land use and management decisions for that park. Examples:
      the Laguna Coast Wilderness Park General Development and Resource Management Plans (1998) and the
      Aliso and Wood Canyons Wilderness Park Resource Management Plan (2009) in Orange County.'
    annotations:
      runtime: term PlanType "Park management plan"
    is_a: ConservationPlan
  JointVentureImplementationPlan:
    class_uri: ICON:0007034
    title: joint venture implementation plan
    description: 'A conservation plan for the region of one Migratory Bird Joint Venture, the voluntary,
      non-regulatory partnerships of agencies, organizations and landowners set up under the North American
      Waterfowl Management Plan and administered by the U.S. Fish and Wildlife Service, that steps continental
      bird population objectives down to the region, sets habitat goals in acres to protect, restore and
      enhance, and names the partnership''s priorities and strategies for reaching them. The partners
      carry out the projects; the plan binds no one. Example: the San Francisco Bay Joint Venture''s 2022
      Implementation Strategy, Restoring the Estuary.'
    annotations:
      runtime: term PlanType "Joint venture implementation plan"
    is_a: ConservationPlan
  ContinentalBirdConservationPlan:
    class_uri: ICON:0007035
    title: continental bird conservation plan
    description: 'A conservation plan for one group of birds across North America, accepted by the national
      governments of Canada, the United States and Mexico or adopted by a continental partnership, that
      sets continental population, habitat and supporter goals and objectives and recommends how its governance
      bodies, science teams and partners should pursue them. Regional Migratory Bird Joint Ventures step
      its continental objectives down to their regions in joint venture implementation plans. It binds
      no one. Example: the North American Waterfowl Management Plan (1986; 2024 Update).'
    annotations:
      runtime: term PlanType "Continental bird conservation plan"
    is_a: ConservationPlan
  StormWaterResourcePlan:
    class_uri: ICON:0007036
    title: storm water resource plan
    description: 'A conservation plan for one watershed, written under California''s Storm Water Resource
      Planning Act (Senate Bill 985, 2014) and the State Water Resources Control Board''s guidelines by
      the cities, counties and special districts that manage storm water there, that identifies and ranks
      multi-benefit projects using storm water and dry weather runoff as a resource, to improve water
      quality, recharge groundwater, reduce flooding and restore habitat. Incorporated into the region''s
      integrated regional water management plan, it makes its projects eligible for state storm water
      implementation grants, and it binds no agency to build them. Example: the Russian River Storm Water
      Resource Plan (2018).'
    annotations:
      runtime: term PlanType "Storm water resource plan"
    is_a: ConservationPlan
  RegionalManagementPlan:
    class_uri: ICON:0007037
    title: regional management plan
    description: 'A comprehensive, long-term plan for one region that a state agency must adopt under
      a statute naming the region''s goals, that sets regulatory policies binding the state and local
      agencies whose projects there are covered by the plan, together with nonregulatory recommendations
      to other agencies and the Legislature, and is amended as conditions and science change. Agencies
      certify their covered projects as consistent with the plan, and the adopting agency hears appeals
      of those certifications. Example: the Delta Plan, which the Delta Stewardship Council adopted in
      2013 under the Sacramento-San Joaquin Delta Reform Act of 2009 to achieve the coequal goals of water
      supply reliability and a healthy Delta ecosystem.'
    annotations:
      runtime: term PlanType "Regional management plan"
    is_a: ConservationPlan
  EagleConservationPlan:
    class_uri: ICON:0007038
    title: eagle conservation plan
    description: 'A conservation plan that a project proponent prepares with the U.S. Fish and Wildlife
      Service under the Bald and Golden Eagle Protection Act and the Service''s eagle take permit rules,
      that assesses how bald and golden eagles use the project area, estimates the eagle take the project''s
      activities may cause, sets avoidance and minimization measures, and commits to monitoring and to
      mitigation that offsets the take, so the Service can issue an eagle take permit. Example: San Diego
      Gas & Electric''s Eagle Conservation Plan (2023), Appendix B of its HCP Amendment.'
    annotations:
      runtime: term PlanType "Eagle conservation plan"
    is_a: ConservationPlan
  RangelandManagementPlan:
    class_uri: ICON:0007039
    title: rangeland management plan
    description: 'A plan for livestock grazing on land a public agency owns, that sets stocking rates,
      residual dry matter targets, grazing seasons and the fencing and water developments that keep cattle
      out of streams and reservoirs, so that grazing reduces wildland fuel and serves water quality and
      native habitat, and that the agency carries out through its grazing leases. Example: the San Francisco
      Public Utilities Commission''s Alameda Creek Watershed Rangeland Management Plan (2026), which updates
      the 1997 Grazing Resources Management Plan of its Alameda Watershed Management Plan.'
    comments:
    - Added for the SFPUC Alameda Creek Watershed Rangeland Management Plan (#1115).
    annotations:
      runtime: term PlanType "Rangeland management plan"
    is_a: ConservationPlan
  ConservationProposal:
    class_uri: ICON:0007040
    title: conservation proposal
    description: 'A conservation plan written by an organization that neither owns nor manages the lands
      it covers, proposing new designations, legislation or management direction for those lands, usually
      public ones, to the agencies and lawmakers who could adopt it. It binds no one until they act on
      it. Example: the California Chaparral Institute''s California Chaparral Preservation Plan (2021),
      which asks that the four southern California national forests become National Chaparral Recreation
      Areas.'
    annotations:
      runtime: term PlanType "Conservation proposal"
    is_a: ConservationPlan
  ForestHealthPlan:
    class_uri: ICON:0007041
    title: forest health plan
    description: 'A plan that maps, ranks and sequences fuel reduction, thinning, prescribed fire and
      related restoration treatments across a forest landscape, usually national forest land under a NEPA
      decision, so that the agency and its partners can fund and contract the work in priority order.
      Example: the Upper Mokelumne River Watershed Authority and Eldorado National Forest''s Forest Projects
      Plan Phase 1 (2023), which sequences fuels treatments on about 26,000 acres of the Amador Ranger
      District.'
    comments:
    - Added for the Upper Mokelumne River Watershed Authority's Forest Projects Plan Phase 1 (#1132).
    annotations:
      runtime: term PlanType "Forest health plan"
    is_a: ConservationPlan
  InvasiveSpeciesManagementPlan:
    class_uri: ICON:0007042
    title: invasive species management plan
    description: 'A plan that inventories the invasive non-native plants or animals on a body of land,
      ranks the species and infestations for treatment, and sets out the control methods, monitoring and
      best management practices the land manager will use to contain or eradicate them. Example: the Conejo
      Open Space Conservation Agency''s Invasive Plant Management Plan (2026), which ranks about 50 invasive
      plants in three priority tiers across about 13,000 acres of open space.'
    comments:
    - Added for the Conejo Open Space Conservation Agency's Invasive Plant Management Plan (#1157).
    annotations:
      runtime: term PlanType "Invasive species management plan"
    is_a: ConservationPlan
  HazardMitigationPlan:
    class_uri: ICON:0007043
    title: hazard mitigation plan
    description: 'A plan, usually written to FEMA''s local hazard mitigation planning rules, that identifies
      the natural hazards such as wildfire, flood, earthquake and landslide that could damage an agency''s
      or community''s facilities and lands, assesses its vulnerability to them, and lists actions to reduce
      their impacts before a disaster. Example: the Mountains Recreation and Conservation Authority''s
      Draft Hazard Mitigation Plan (2021), limited to the park facilities MRCA owns and maintains.'
    comments:
    - Added for the Mountains Recreation and Conservation Authority's Hazard Mitigation Plan (#1177).
    annotations:
      runtime: term PlanType "Hazard mitigation plan"
    is_a: ConservationPlan
  PublicWorksPlan:
    class_uri: ICON:0007044
    title: public works plan
    description: 'A long-range plan under the California Coastal Act (Public Resources Code 30605) in
      which a public agency lays out the parks, trails, access ways, and facilities it intends to build
      in the coastal zone, so that the Coastal Commission can certify the whole program at once instead
      of permitting each project. Example: the Malibu Parks Public Access Enhancement Plan, adopted in
      2010 by the Mountains Recreation and Conservation Authority and the Santa Monica Mountains Conservancy.'
    comments:
    - Added for the Mountains Recreation and Conservation Authority's Malibu public works plans (#1177).
    annotations:
      runtime: term PlanType "Public works plan"
    is_a: ConservationPlan
  ForestManagementPlan:
    class_uri: ICON:0007045
    title: forest management plan
    description: 'A plan for one forest property, adopted by the owner that manages it, that sets the
      forest''s objectives (such as research, demonstration, education, or timber production) and how
      it is administered, and divides the forest into compartments or stands assigned to management regimes
      such as even-aged, uneven-aged, or reserve, so that harvests, treatments, and research can be planned
      and compared over decades while soil, water, and other resources are conserved. Example: the Policy
      for Use of Blodgett Forest Research Station (2012), UC Berkeley''s management plan for its 4,356-acre
      research forest in El Dorado County.'
    comments:
    - Added for Berkeley Forests' Policy for Use of Blodgett Forest Research Station (#1187).
    annotations:
      runtime: term PlanType "Forest management plan"
    is_a: ConservationPlan
  InteragencyActionPlan:
    class_uri: ICON:0007046
    title: interagency action plan
    description: 'A statewide plan issued by an interagency task force that a governor convenes, which
      folds existing state and federal plans, mandates, and reports into one strategy, sets goals with
      acreage and other numerical targets for a fixed period, and assigns numbered actions with deadlines
      to named state and federal agencies, carried out as resources allow while the task force tracks
      progress. Example: California''s Wildfire and Forest Resilience Action Plan (2021) of the Governor''s
      Forest Management Task Force, the first five-year plan under the state''s Shared Stewardship Agreement
      with the USDA Forest Service.'
    comments:
    - Added for California's Wildfire and Forest Resilience Action Plan (#1185).
    annotations:
      runtime: term PlanType "Interagency action plan"
    is_a: ConservationPlan
  EelgrassManagementPlan:
    class_uri: ICON:0007047
    title: eelgrass management plan
    description: 'A plan for the eelgrass (Zostera) beds of one bay or estuary, adopted by the agency
      that manages its waters, that maps existing and damaged beds, sets boundaries where anchoring, mooring
      or other uses that scour the beds are barred, sets acreage targets and methods for replanting, and
      lays out monitoring and adaptive management. Example: the Richardson''s Bay Regional Agency''s Eelgrass
      Protection and Management Plan (2021), which created the Eelgrass Protection Zone, and its Eelgrass
      Restoration and Adaptive Management Plan (2023).'
    comments:
    - Added for the Richardson's Bay Regional Agency's two eelgrass plans (#1188).
    annotations:
      runtime: term PlanType "Eelgrass management plan"
    is_a: ConservationPlan
  AnchorageManagementPlan:
    class_uri: ICON:0007048
    title: anchorage management plan
    description: 'A plan adopted by the agency that regulates an anchorage, harbor or mooring area for
      the vessels kept there, that sets time limits, permits and enforcement priorities, schedules the
      removal of unpermitted, derelict or occupied vessels, and connects people living aboard with housing
      and other services, often to protect habitat on the bottom from anchor damage. Example: the Richardson''s
      Bay Regional Agency Transition Plan (2020).'
    comments:
    - Added for the Richardson's Bay Regional Agency Transition Plan (#1188).
    annotations:
      runtime: term PlanType "Anchorage management plan"
    is_a: ConservationPlan
  SpeciesManagementAndMonitoringPlan:
    class_uri: ICON:0007049
    title: species management and monitoring plan
    description: 'A plan for one listed species across its whole range, written by the agencies, land
      managers and scientists that hold its habitat, that maps its habitat and population units, assesses
      threats, sets desired habitat and population conditions, and standardizes how the species is managed,
      monitored and reported so that the separate reserves and permits covering it add up to a recovery
      assessment. It is not the recovery plan the Fish and Wildlife Service issues under the Endangered
      Species Act. Example: the Stephens'' Kangaroo Rat Rangewide Management and Monitoring Plan (2021).'
    comments:
    - Added for the Stephens' Kangaroo Rat Rangewide Management and Monitoring Plan (#1237).
    annotations:
      runtime: term PlanType "Species management and monitoring plan"
    is_a: ConservationPlan
  RestorationFeasibilityPlan:
    class_uri: ICON:0007050
    title: restoration feasibility plan
    description: 'A plan that reviews the condition of a degraded lake, wetland or landscape and the restoration
      alternatives tried or proposed before, develops conceptual projects with cost estimates, and matches
      them to realistic funding sources, to recommend a restoration that is feasible and affordable rather
      than adopting a binding program. Example: the Salton Sea Funding and Feasibility Action Plan (2016).'
    comments:
    - Added for the Salton Sea Authority's Funding and Feasibility Action Plan (#1243).
    annotations:
      runtime: term PlanType "Restoration feasibility plan"
    is_a: ConservationPlan
  StatewideComprehensiveOutdoorRecreationPlan:
    class_uri: ICON:0007051
    title: statewide comprehensive outdoor recreation plan
    description: 'A plan a state''s outdoor recreation agency keeps current for the federal Land and Water
      Conservation Fund, which requires one for a state to receive its grants: it assesses the supply
      of and demand for outdoor recreation, sets the state''s priorities for recreation grants for about
      five years, and states the criteria grant applications are scored by. Example: California''s 2021-2025
      Statewide Comprehensive Outdoor Recreation Plan, by State Parks'' Office of Grants and Local Services,
      which centers park access and equity.'
    comments:
    - Added for California's 2021-2025 SCORP (#1348).
    annotations:
      runtime: term PlanType "Statewide comprehensive outdoor recreation plan"
    is_a: ConservationPlan
  SpeciesConservationPlan:
    class_uri: ICON:0007052
    title: species conservation plan
    description: 'A conservation plan for one species that a state law directs the state wildlife agency
      to prepare across the species'' range in the state, setting conservation targets and the actions
      to meet them, such as avoiding and minimizing impacts, conserving and managing land, tribal co-management,
      research and public education. Example: CDFW''s Western Joshua Tree Conservation Plan, required
      by the Western Joshua Tree Conservation Act and approved by the Fish and Game Commission in 2025.'
    comments:
    - Added for the Western Joshua Tree Conservation Plan (#1362).
    annotations:
      runtime: term PlanType "Species conservation plan"
    is_a: ConservationPlan
  GroundwaterSustainabilityPlan:
    class_uri: ICON:0007053
    title: groundwater sustainability plan
    description: 'A plan that the groundwater sustainability agencies of a medium or high priority basin
      adopt under California''s Sustainable Groundwater Management Act of 2014 (Water Code Section 10720
      and following) and submit to the Department of Water Resources, which reviews it and approves it,
      finds it incomplete, or finds it inadequate. It sets a sustainability goal to be reached within
      20 years, defines undesirable results for the six sustainability indicators (chronic lowering of
      groundwater levels, reduction of storage, seawater intrusion, degraded water quality, land subsidence,
      and depletion of interconnected surface water), sets minimum thresholds and measurable objectives
      at representative monitoring sites, and lists the projects and management actions that keep the
      basin sustainable. It is reviewed every five years. Example: the Tule Lake Subbasin Groundwater
      Sustainability Plan (2021).'
    comments:
    - Added for the Tule Lake Subbasin Groundwater Sustainability Plan (#1453).
    annotations:
      runtime: term PlanType "Groundwater sustainability plan"
    is_a: ConservationPlan
  HabitatActionPlan:
    class_uri: ICON:0007054
    title: habitat action plan
    description: 'A plan by a state agency for one kind of habitat across the state''s lands or waters,
      such as its kelp forests, that summarizes the state-supported research, monitoring and restoration
      under way, names the knowledge gaps resource managers face, and sets priorities for action in research
      and monitoring, policy, restoration, and community and tribal engagement, often as an interim step
      toward a fuller management plan. Lead entities and timelines may be left to a later version. Example:
      the Ocean Protection Council''s Interim Action Plan for Protecting and Restoring California''s Kelp
      Forests (2021), written with CDFW.'
    comments:
    - Added for the Interim Action Plan for Protecting and Restoring California's Kelp Forests (#1487).
    annotations:
      runtime: term PlanType "Habitat action plan"
    is_a: ConservationPlan
  EcosystemBasedManagementPlan:
    class_uri: ICON:0007055
    title: ecosystem-based management plan
    description: 'A state plan for a marine ecosystem built on foundation species, such as California''s
      kelp forests, that the state wildlife agency develops with its partners, the tribes, and a community
      working group, and the Fish and Game Commission adopts. It combines a harvest framework, which sets
      how and where the foundation species may be taken, with a restoration framework, which tracks the
      ecosystem''s condition against a baseline and sets the permit pathways for restoration projects,
      and it is managed adaptively as monitoring reports change. Example: CDFW''s statewide Kelp Restoration
      and Management Plan for giant kelp and bull kelp, in development with the Ocean Protection Council.'
    comments:
    - Added for CDFW's Kelp Restoration and Management Plan (#1495).
    annotations:
      runtime: term PlanType "Ecosystem-based management plan"
    is_a: ConservationPlan
  LandManagementPlan:
    class_uri: ICON:0007056
    title: land management plan
    description: 'A plan by the California Department of Fish and Wildlife for one of its wildlife areas
      or ecological reserves, written to the Department''s Guide and Annotated Outline for Writing Land
      Management Plans, that describes the property, its resources and its public uses and sets goals
      and tasks by element (biological, public use, agricultural, cultural, facilities maintenance, administrative,
      research and monitoring, and management coordination), with the staff hours and operations budget
      needed to carry them out. Example: the Napa-Sonoma Marshes Wildlife Area Land Management Plan (2011).'
    comments:
    - Added for the Napa-Sonoma Marshes Wildlife Area Land Management Plan (#1543).
    annotations:
      runtime: term PlanType "Land management plan"
    is_a: ConservationPlan
  StatewidePollutionStrategy:
    class_uri: ICON:0007057
    title: statewide pollution strategy
    description: 'A plan a state agency adopts because a statute requires it, to reduce one kind of pollution
      across the state: it reviews the sources and pathways of the pollutant, lays out a phased roadmap
      of solutions such as prevention at the source and interventions on pathways like stormwater, sets
      research priorities, and calls for further work with the sectors involved. It guides the agency''s
      funding and recommendations but binds no one. Example: California''s Statewide Microplastics Strategy
      (2022), which the Ocean Protection Council adopted under SB 1263 (2018).'
    comments:
    - Added for California's Statewide Microplastics Strategy (#1351).
    annotations:
      runtime: term PlanType "Statewide pollution strategy"
    is_a: ConservationPlan
  RegionalEconomicPlan:
    class_uri: ICON:0007122
    title: regional economic plan
    description: 'A plan for the economy of one region, prepared by a regional agency, often because a
      statute requires it, that assesses the region''s economic sectors and the effects of proposed state
      projects and policies on them, and recommends actions to sustain the regional economy. Example:
      the Economic Sustainability Plan for the Sacramento-San Joaquin River Delta, which the Delta Protection
      Commission adopted in 2012 as the Delta Reform Act requires.'
    comments:
    - Added for the Delta Protection Commission's Economic Sustainability Plan (#1677).
    annotations:
      runtime: term PlanType "Regional economic plan"
    is_a: ConservationPlan
  HeritageAreaManagementPlan:
    class_uri: ICON:0007123
    title: heritage area management plan
    description: 'The plan that the local coordinating entity of a National Heritage Area writes with
      partners and the public, and the Secretary of the Interior approves, that sets the area''s interpretive
      themes, goals, and strategies for preserving, interpreting, and promoting its natural, cultural,
      and historic resources. Example: the Sacramento-San Joaquin Delta National Heritage Area Management
      Plan, approved in January 2025.'
    comments:
    - Added for the Sacramento-San Joaquin Delta National Heritage Area Management Plan (#1677).
    annotations:
      runtime: term PlanType "Heritage area management plan"
    is_a: ConservationPlan
  CommunityActionPlan:
    class_uri: ICON:0007124
    title: community action plan
    description: 'A plan for one small community, prepared with its residents and its local government,
      that names improvements to quality of life, economic development, historic preservation, transportation,
      and public safety, and the steps and partners to carry them out. Example: the Walnut Grove Community
      Action Plan (2016), prepared with support from the Delta Protection Commission.'
    comments:
    - Added for the community action plans of four Sacramento River Delta towns (#1677).
    annotations:
      runtime: term PlanType "Community action plan"
    is_a: ConservationPlan
  TrailMasterPlan:
    class_uri: ICON:0007125
    title: trail master plan
    description: 'A plan for a regional trail system that sets its alignment, the standards and process
      for designating segments, and how the segments are funded, built, operated, and maintained by the
      agencies along it. Example: the Great California Delta Trail Master Plan, by the Delta Protection
      Commission.'
    comments:
    - Added for the Great California Delta Trail Master Plan (#1677).
    annotations:
      runtime: term PlanType "Trail master plan"
    is_a: ConservationPlan
