enums:
  ToolFunctionEnum:
    enum_uri: ICON:0013010
    description: The values of tool function.
    permissible_values:
      prioritizing function:
        meaning: ICON:0013011
        description: Ranks or scores places, sites or projects so the best ones can be chosen first.
        annotations:
          runtime: term ToolFunction "Prioritize places or projects"
      screening function:
        meaning: ICON:0013012
        description: Checks a proposed project against rules, sensitive resources or eligibility criteria
          before it goes ahead.
        annotations:
          runtime: term ToolFunction "Screen a project"
      carbon estimating function:
        meaning: ICON:0013013
        description: Calculates carbon stored or greenhouse gases emitted or avoided.
        annotations:
          runtime: term ToolFunction "Estimate carbon or greenhouse gases"
      projecting function:
        meaning: ICON:0013014
        description: Shows how conditions may change under future climate, sea level rise or land use.
        annotations:
          runtime: term ToolFunction "Project future conditions"
      habitat quantifying function:
        meaning: ICON:0013015
        description: Measures how much habitat there is and how good it is.
        annotations:
          runtime: term ToolFunction "Quantify habitat"
      mapping function:
        meaning: ICON:0013016
        description: Shows where resources, conditions or hazards are, for browsing and querying.
        annotations:
          runtime: term ToolFunction "Map resources or hazards"
      vulnerability assessing function:
        meaning: ICON:0013017
        description: Judges how exposed and sensitive people, places or species are to a threat.
        annotations:
          runtime: term ToolFunction "Assess vulnerability or risk"
      scenario comparing function:
        meaning: ICON:0013018
        description: Runs alternative management or development choices side by side to weigh their effects.
        annotations:
          runtime: term ToolFunction "Compare scenarios"
      recommending function:
        meaning: ICON:0013019
        description: Suggests what to do or plant, such as fertilizer rates, seedlots or meadow species.
        annotations:
          runtime: term ToolFunction "Recommend practices or species"
      tracking function:
        meaning: ICON:0013020
        description: Records projects, prices or indicators over time and reports on them.
        annotations:
          runtime: term ToolFunction "Track projects or indicators"
      species detecting function:
        meaning: ICON:0013021
        description: Finds and counts animals or plants, as in images.
        annotations:
          runtime: term ToolFunction "Detect or count species"
      funding application function:
        meaning: ICON:0013022
        description: Helps applicants build a proposal or meet the requirements of a grant program.
        annotations:
          runtime: term ToolFunction "Prepare a funding application"
